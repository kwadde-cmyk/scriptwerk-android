name: Release AAB

# Play upload. Manual only: it does not run after Sync, does not publish to
# Zapstore, and does not create a release tag (that would make the APK workflow
# think this versionCode is already shipped).
on:
  workflow_dispatch:
    inputs:
      attach:
        description: "Upload the AAB onto the GitHub release that already has this version's APK"
        type: boolean
        default: false

concurrency:
  group: release-aab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          gradle=android/app/build.gradle
          name=$(grep -oE 'versionName "[^"]+"' "$gradle" | head -1 | cut -d'"' -f2)
          code=$(grep -oE 'versionCode [0-9]+' "$gradle" | head -1 | awk '{print $2}')
          if [ -z "$name" ] || [ -z "$code" ]; then echo "::error::versionName/versionCode not found"; exit 1; fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "asset=Scriptwerk-${name}-code${code}.aab"
            echo "apk=Scriptwerk-${name}-code${code}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "version $name ($code)"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::missing repo secrets:$missing"; exit 1; fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/scriptwerk-release.jks"
          printf '%s' "$KS" | base64 -d > "$ks"
          chmod 600 "$ks"
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install --user --quiet pillow

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:aab

      - name: Verify AAB
        id: verify
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          aab="artifacts/release/${{ steps.ver.outputs.asset }}"
          [ -f "$aab" ] || { echo "::error::$aab not found"; ls -la artifacts/release || true; exit 1; }
          jarsigner -verify -certs "$aab"
          keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/aab-cert.txt"
          cert=$(grep -m1 'SHA256:' "$RUNNER_TEMP/aab-cert.txt" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$cert" ] || { echo "::error::no SHA-256 in keytool output"; exit 1; }
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            want=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$cert" = "$want" ] || { echo "::error::signing cert $cert != expected $want"; exit 1; }
          fi
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$aab" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.asset }}
          path: artifacts/release/${{ steps.ver.outputs.asset }}
          retention-days: 14
          if-no-files-found: error

      - name: Attach AAB to the existing APK release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="${{ steps.ver.outputs.apk }}"
          aab="artifacts/release/${{ steps.ver.outputs.asset }}"
          tag=""
          for t in "v${{ steps.ver.outputs.name }}-code${{ steps.ver.outputs.code }}" "v${{ steps.ver.outputs.name }}"; do
            if gh release view "$t" --json assets -q '.assets[].name' 2>/dev/null | grep -qx -- "$apk"; then
              tag=$t
              break
            fi
          done
          if [ -z "$tag" ]; then
            echo "::error::no release with $apk yet. Download the Actions artifact, or run Release APK first and rerun with attach."
            exit 1
          fi
          gh release upload "$tag" "$aab" --clobber
          echo "attached to $tag"
